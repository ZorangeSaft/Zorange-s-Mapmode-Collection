 mapmode_anb_location_size_name: "Location Size"
 MAPMODE_ANB_LOCATION_SIZE: "#T $mapmode_anb_location_size_name$#!\nDisplays the location size colours indicate how close a location is to the normal (25).\nThis is not to be confused with pixel size, location size is adjusted for latitude and the game multiplies this modifier by the location size:\n\n[GetModifier('location_size_impact').GetDesc]\nLocations do not have to be the normal size or even close to it, just be aware of the modifier they will get.\n\n\nThis mapmode was originally created by Cyrob for Anbennar and is used with permission." 
 ANB_LOCATION_SIZE_MAPMODE_TT: "[ROOT.GetLocation.GetName] has a location size of [ROOT.GetLocation.GetLocationSize|Y]\nThe location gets this modifier multiplied by [ROOT.GetLocation.GetLocationSize|Y]:\n[GetModifier('location_size_impact').GetDesc]."
